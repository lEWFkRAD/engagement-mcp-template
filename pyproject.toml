[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engagement-mcp-template"
version = "0.1.0"
description = "Blank, reusable template for the engagement-MCP pattern: one engagement, one folder, one read-only-by-default stdio MCP server over a job ontology."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
engagement-mcp = "engagement_mcp:main"

[tool.setuptools]
py-modules = ["engagement_mcp"]
